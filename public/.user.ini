; PHP limits for the admin panel's media uploads (reel videos are the largest,
; at up to 40 MB). Both values matter: post_max_size caps the whole request, so
; it must be at least as large as upload_max_filesize or the file is dropped
; before PHP ever sees it.
;
; .user.ini is read by PHP running as CGI/FastCGI/PHP-FPM, which is what most
; shared hosts use. Servers running PHP as an Apache module ignore this file —
; there the same values have to be set in php.ini or by the host. Either way it
; is safe to ship: an unsupported directive here is skipped, not an error.
;
; Note PHP caches .user.ini for user_ini.cache_ttl seconds (300 by default), so
; a change can take up to five minutes to take effect.

upload_max_filesize = 40M
post_max_size = 42M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
